name: Silver ETF Sentinel Daily Run

on:
  schedule:
    # 0 2 * * 1-5 runs at 02:00 UTC (which is exactly 07:30 AM IST)
    - cron: '0 2 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI for testing

jobs:
  run-sentinel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Caches dependencies to speed up the run
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Sentinel Script
      env:
        INVESTOR_EMAIL: ${{ secrets.INVESTOR_EMAIL }}
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASS: ${{ secrets.SMTP_PASS }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
        SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
      run: |
        python sentinel.py

    - name: Commit state.json if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add state.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update Sentinel State [skip ci]" && git push)
